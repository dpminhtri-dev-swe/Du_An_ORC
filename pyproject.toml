[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrc-reconcile"
version = "0.1.0"
description = "Local HRC certificate data reconciliation tool"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "Pillow>=10.4",
    "opencv-python-headless>=4.10",
    "PyMuPDF>=1.24",
    "rapidocr-onnxruntime>=1.2.3,<1.3",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
